    <text x="908" y="140" font-family="Arial, Helvetica, sans-serif" font-size="10.5" font-weight="700" letter-spacing="1" fill="#C4B5FD">NATIONAL WORKSHOP</text>
    <text x="895" y="174" font-family="Arial, Helvetica, sans-serif" font-size="14.5" font-weight="800" letter-spacing="0.3" fill="#E6F7FF">QUANTUM ALGORITHMS</text>
    <text x="895" y="196" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="800" letter-spacing="0.7" fill="#E6F7FF">TO QUANTUM AI</text>
