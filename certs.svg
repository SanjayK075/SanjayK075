      <path d="M824 182 H814 M824 197 H814 M824 212 H814 M879 182 H889 M879 197 H889 M879 212 H889 M835 171 V161 M849 171 V161 M863 171 V161 M835 226 V236 M849 226 V236 M863 226 V236" stroke="#00E5FF"/>
      <path d="M837 188 H866 M837 198 H866 M837 208 H866 M842 183 V214 M852 183 V214 M862 183 V214" stroke="#A78BFA" stroke-opacity="0.8"/>
