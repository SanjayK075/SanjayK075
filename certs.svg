    <text x="503" y="196" font-family="Arial, Helvetica, sans-serif" font-size="14.5" font-weight="800" letter-spacing="0.2" fill="#E6F7FF">COMMUNICATION SECURITY</text>
    <text x="503" y="231" font-family="Arial, Helvetica, sans-serif" font-size="15.5" fill="#9FB3E7">VIT Vellore · June 2026</text>
