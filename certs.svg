    <text x="119" y="176" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="800" letter-spacing="0.8" fill="#E6F7FF">IBM AGENTIC AI</text>
    <text x="119" y="207" font-family="Arial, Helvetica, sans-serif" font-size="15.5" fill="#9FB3E7">Autonomous agents, multi-agent</text>
    <text x="119" y="230" font-family="Arial, Helvetica, sans-serif" font-size="15.5" fill="#9FB3E7">orchestration, RAG and MCP</text>
  </g>

