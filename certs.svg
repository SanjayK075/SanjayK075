      <line x1="73" y1="166" x2="104" y2="184" stroke-dasharray="3 4" stroke-opacity="0.35"/><line x1="104" y1="184" x2="104" y2="244" stroke-dasharray="3 4" stroke-opacity="0.35"/><line x1="104" y1="244" x2="42" y2="244" stroke-dasharray="3 4" stroke-opacity="0.35"/><line x1="42" y1="244" x2="42" y2="184" stroke-dasharray="3 4" stroke-opacity="0.35"/>
