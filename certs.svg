<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="370" viewBox="0 0 1200 370" role="img" aria-labelledby="title desc">
  <title id="title">Certifications and workshops</title>
  <desc id="desc">IBM Agentic AI; Next-Generation Vehicular Communication Security at VIT Vellore in June 2026; and the National Level One Day Hands-On Workshop on Quantum Algorithms to Quantum AI using PennyLane and Bloqade, held at VIT Vellore on 12 October 2026.</desc>
  <defs>
    <linearGradient id="frameGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#00E5FF"/><stop offset="0.5" stop-color="#8B5CF6"/><stop offset="1" stop-color="#FF2E97"/>
    </linearGradient>
    <linearGradient id="titleGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00E5FF"/><stop offset="0.48" stop-color="#8B5CF6"/><stop offset="0.75" stop-color="#FF2E97"/><stop offset="1" stop-color="#00E5FF"/>
      <animate attributeName="x1" values="0;1;0" dur="8s" repeatCount="indefinite"/>
    </linearGradient>
    <radialGradient id="bgGlow" cx="50%" cy="0%" r="100%">
      <stop offset="0" stop-color="#121A3D"/><stop offset="0.62" stop-color="#0A0F24"/><stop offset="1" stop-color="#05060F"/>
    </radialGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0"/><stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0.08"/><stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="3" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="clip0"><rect x="28" y="105" width="370" height="230" rx="18"/></clipPath>
    <clipPath id="clip1"><rect x="415" y="105" width="370" height="230" rx="18"/></clipPath>
    <clipPath id="clip2"><rect x="802" y="105" width="370" height="230" rx="18"/></clipPath>
  </defs>

  <rect x="1" y="1" width="1198" height="368" rx="22" fill="url(#bgGlow)" stroke="url(#frameGrad)" stroke-opacity="0.62" stroke-width="1.5"/>
  <text x="600" y="48" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="800" letter-spacing="6" fill="url(#titleGrad)">CERTIFICATIONS</text>
  <text x="600" y="76" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" font-size="14" letter-spacing="2" fill="#8FA4D4">completed beyond the coursework</text>
  <line x1="380" y1="88" x2="820" y2="88" stroke="url(#frameGrad)" stroke-opacity="0.24"/>

